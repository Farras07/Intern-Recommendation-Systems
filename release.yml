name: CI/CD to Vercel

on:
  push:
    branches:
      - master
      - test

jobs:
  # ========================
  # 🚀 Production Deployment
  # ========================
  deploy_production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      DEPLOY_ENV: production
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL_PROD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_PROD }}
      # 🔥 add your Firebase + other prod envs here...

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: "."

  # =====================
  # 🧪 Preview Deployment
  # =====================
  deploy_preview:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: Test
      DEPLOY_ENV: preview
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL_PREVIEW }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_PREVIEW }}
      # 🔥 add your Firebase + other test envs here...

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: "."
          # ⚠️ no --prod flag → creates a preview deployment
